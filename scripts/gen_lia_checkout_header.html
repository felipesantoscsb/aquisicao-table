<!DOCTYPE html>
<!-- Banner de cabeçalho do checkout Ticto. 1200x320 (dentro de 1068-1200 x 50-900). -->
<html lang="pt-BR"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:320px;background:#242C1F;overflow:hidden;position:relative;
     display:flex;align-items:center;justify-content:center;text-align:center;
     font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
body::before{content:"";position:absolute;inset:auto auto -180px -120px;width:480px;height:480px;
     border-radius:50%;background:radial-gradient(circle,rgba(107,125,92,.4),transparent 68%)}
body::after{content:"";position:absolute;inset:-160px -100px auto auto;width:420px;height:420px;
     border-radius:50%;background:radial-gradient(circle,rgba(185,112,64,.18),transparent 68%)}
.in{position:relative;z-index:1;padding:0 60px}
.eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#9AAE8A;margin-bottom:20px}
h1{color:#F4F2EB;font-family:ui-serif,'New York','Iowan Old Style',Palatino,Georgia,serif;
   font-weight:400;font-size:52px;line-height:1.18;letter-spacing:-.01em;max-width:19ch;margin:0 auto}
h1 .hl{color:#CFE0C0}
</style></head><body>
  <div class="in">
    <div class="eyebrow">LIA · Table</div>
    <h1>Entre saber e conseguir,<br/><span class="hl">a LIA fica com você.</span></h1>
  </div>
</body></html>
