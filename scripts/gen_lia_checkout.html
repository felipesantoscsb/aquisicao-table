<!DOCTYPE html>
<!--
  Imagem do produto no checkout (300x250). Render:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=300,250 --screenshot=/tmp/lia-checkout.png \
      file://$PWD/scripts/gen_lia_checkout.html
    sips -z 250 300 /tmp/lia-checkout.png --out public/images/lia-checkout.png
-->
<html lang="pt-BR"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:300px;height:250px;background:#242C1F;color:#F2F0E9;overflow:hidden;position:relative;
     font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
     display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
body::before{content:"";position:absolute;inset:auto auto -90px -70px;width:240px;height:240px;
     border-radius:50%;background:radial-gradient(circle,rgba(107,125,92,.4),transparent 68%)}
body::after{content:"";position:absolute;inset:-60px -50px auto auto;width:170px;height:170px;
     border-radius:50%;background:radial-gradient(circle,rgba(185,112,64,.16),transparent 70%)}
.in{position:relative;z-index:1}
h1{font-family:ui-serif,'New York','Iowan Old Style',Palatino,Georgia,serif;font-weight:400;
   font-size:62px;line-height:1;letter-spacing:.07em;margin-bottom:14px}
.rule{width:38px;height:1px;background:#6B7D5C;opacity:.7;margin:0 auto 20px}
.what{font-size:14px;color:#D3D6CD;line-height:1.4;max-width:22ch;margin:0 auto}
.by{position:absolute;bottom:16px;left:0;right:0;font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;color:#7C8474;z-index:1}
</style></head>
<body>
  <div class="in">
    <h1>LIA</h1>
    <div class="rule"></div>
    <p class="what">Acompanhamento diário<br/>pelo WhatsApp</p>
  </div>
  <div class="by">uma inteligência da Table</div>
</body></html>
