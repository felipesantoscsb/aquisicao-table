<!DOCTYPE html>
<!-- Foto de perfil do WhatsApp (640x640, recorte circular). -->
<html lang="pt-BR"><head><meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:640px;height:640px;background:#242C1F;overflow:hidden;position:relative;
     display:flex;align-items:center;justify-content:center}
body::before{content:"";position:absolute;inset:auto auto -170px -140px;width:460px;height:460px;
     border-radius:50%;background:radial-gradient(circle,rgba(107,125,92,.5),transparent 66%)}
body::after{content:"";position:absolute;inset:-130px -110px auto auto;width:360px;height:360px;
     border-radius:50%;background:radial-gradient(circle,rgba(185,112,64,.22),transparent 68%)}
h1{position:relative;z-index:1;color:#F4F2EB;
   font-family:ui-serif,'New York','Iowan Old Style',Palatino,Georgia,serif;
   font-weight:400;font-size:250px;line-height:1;letter-spacing:.06em;
   text-indent:.06em;margin-top:-8px}
</style></head><body><h1>LIA</h1></body></html>
